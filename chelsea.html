<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Feliz Cumpleaños Fede – Chelsea FC Especial</title>
  <meta name="description" content="Edición Especial Chelsea FC – ¡Feliz Cumpleaños Fede! Recuerdos y momentos inolvidables de los Blues." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Feliz Cumpleaños Fede – Chelsea FC Especial" />
  <meta property="og:description" content="Edición especial dedicada a Federico Alvarez. Orgullo Blue y momentos Chelsea FC." />
  <meta property="og:image" content="./assets/fede-chelsea.jpg" />
  <meta property="og:type" content="website" />

  <!-- Styles -->
  <link rel="stylesheet" href="./styles/main.css" />
  <!-- AOS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
</head>
<body class="chelsea-page-body">

  <!-- Scroll progress bar -->
  <div id="scroll-progress" role="progressbar" aria-label="Progreso de scroll"></div>

  <!-- Cursor glow -->
  <div id="cursor-glow" aria-hidden="true"></div>

  <!-- Lightbox Modal -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button id="lightbox-close" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
    <img id="lightbox-img" src="" alt="Foto ampliada" />
  </div>

  <!-- Chelsea Page Content -->
  <main class="chelsea-page-main" id="main">
    <div class="chelsea-glow" aria-hidden="true"></div>

    <div class="chelsea-container">

      <!-- Navigation & Header -->
      <header class="chelsea-header" data-aos="fade-down" data-aos-duration="850">
        <a href="./index.html" class="chelsea-back-btn" aria-label="Volver al inicio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Volver al perfil</span>
        </a>

        <div class="chelsea-badge">
          <span class="chelsea-badge-dot"></span>
          <span>CHELSEA FC · SPECIAL EDITION</span>
        </div>

        <h1 class="chelsea-title">Feliz Cumpleaños Fede</h1>
      </header>

      <!-- 1. Primera imagen destacada: fede-chelsea.jpg -->
      <section class="chelsea-hero-wrap" data-aos="zoom-in" data-aos-duration="900" aria-label="Foto Principal">
        <div class="chelsea-hero-card lightbox-trigger"
             data-src="./assets/fede-chelsea.jpg"
             data-alt="Federico Alvarez – Chelsea FC – Feliz Cumpleaños Fede"
             tabindex="0" role="button" aria-label="Ver foto ampliada de Federico Chelsea">
          <div class="chelsea-hero-img-wrap">
            <img src="./assets/fede-chelsea.jpg" alt="Federico Alvarez – Chelsea FC" loading="eager" />
          </div>
          <div class="chelsea-hero-caption">
            <span class="chelsea-hero-tag">Orgullo Blue</span>
            <h2 class="chelsea-hero-heading">Feliz Cumpleaños Fede</h2>
          </div>
        </div>
      </section>

      <!-- 2. Galería de fotos Chelsea: img0, img1, img2, img3 -->
      <section class="chelsea-gallery-section" aria-label="Galería Chelsea">
        <div class="chelsea-gallery-divider" data-aos="fade-up" data-aos-duration="700">
          <span class="chelsea-line"></span>
          <span class="chelsea-gallery-title">Galería Chelsea</span>
          <span class="chelsea-line"></span>
        </div>

        <div class="chelsea-grid">
          <div class="chelsea-cell lightbox-trigger"
               data-src="./assets/chelsea/img0.jpg"
               data-alt="Chelsea FC – Foto 1"
               data-aos="fade-up"
               data-aos-delay="0"
               tabindex="0" role="button" aria-label="Ver foto ampliada">
            <img src="./assets/chelsea/img0.jpg" alt="Chelsea FC – Foto 1" loading="lazy" />
          </div>

          <div class="chelsea-cell lightbox-trigger"
               data-src="./assets/chelsea/img1.jpg"
               data-alt="Chelsea FC – Foto 2"
               data-aos="fade-up"
               data-aos-delay="80"
               tabindex="0" role="button" aria-label="Ver foto ampliada">
            <img src="./assets/chelsea/img1.jpg" alt="Chelsea FC – Foto 2" loading="lazy" />
          </div>

          <div class="chelsea-cell lightbox-trigger"
               data-src="./assets/chelsea/img2.jpg"
               data-alt="Chelsea FC – Foto 3"
               data-aos="fade-up"
               data-aos-delay="160"
               tabindex="0" role="button" aria-label="Ver foto ampliada">
            <img src="./assets/chelsea/img2.jpg" alt="Chelsea FC – Foto 3" loading="lazy" />
          </div>

          <div class="chelsea-cell lightbox-trigger"
               data-src="./assets/chelsea/img3.jpg"
               data-alt="Chelsea FC – Foto 4"
               data-aos="fade-up"
               data-aos-delay="240"
               tabindex="0" role="button" aria-label="Ver foto ampliada">
            <img src="./assets/chelsea/img3.jpg" alt="Chelsea FC – Foto 4" loading="lazy" />
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="chelsea-footer" data-aos="fade-up">
        <p>© <span id="footer-year"></span> Federico Alvarez · Edición Especial Chelsea</p>
      </footer>

    </div>
  </main>

  <!-- AOS -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

  <!-- Compiled TS logic -->
  <script src="./dist/main.js"></script>

  <!-- Inline year -->
  <script>
    (function () {
      var currentYear = new Date().getFullYear();
      var el = document.getElementById('footer-year');
      if (el) el.textContent = currentYear;
    })();
  </script>

</body>
</html>
